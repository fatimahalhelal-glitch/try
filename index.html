<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قيّم نفسك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: a green MoC band with the brand pattern opens every screen (logos right and left like the official letterhead);
   the body below is a quiet paper ground. One bold moment: the result screen, where the ring counts up and the radar blooms. */
:root{
  --green:#00524d; --navy:#094056; --teal:#38a089; --mint:#d6ebe8;
  --bg:#f5faf7; --card:#ffffff; --ink:#0d2f2c; --soft:#4b6865; --line:#cde2dd;
  --accent:#00524d; --btn:#00524d; --btnfg:#ffffff; --track:#dcebe7;
  --focus:#f48136; --good:#2e7d32; --on-hero:#ffffff; --hero-soft:#d6ebe8;
  --radar-fill:rgba(56,160,137,.28); --radar-line:#00524d; --radar-grid:#bcd5d0;
  --sans:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif;
  direction:rtl;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07191a; --card:#0d2a2a; --ink:#e9f5f2; --soft:#9fbfba; --line:#1c4642;
  --accent:#5fcab0; --btn:#5fcab0; --btnfg:#05221f; --track:#1a3d3a; --focus:#ff9a55; --good:#7bd88a;
  --radar-fill:rgba(95,202,176,.30); --radar-line:#5fcab0; --radar-grid:#27524e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07191a; --card:#0d2a2a; --ink:#e9f5f2; --soft:#9fbfba; --line:#1c4642;
  --accent:#5fcab0; --btn:#5fcab0; --btnfg:#05221f; --track:#1a3d3a; --focus:#ff9a55; --good:#7bd88a;
  --radar-fill:rgba(95,202,176,.30); --radar-line:#5fcab0; --radar-grid:#27524e; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:640px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- hero band ---------- */
.hero{position:relative;background:var(--green);color:var(--on-hero);overflow:hidden;isolation:isolate}
.hero>.pat{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right top;z-index:-1;opacity:.9}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:18px}
.top img{display:block}
.logo-moc{height:40px;width:auto}
.logo-v{height:46px;width:auto}
.hero-in{padding-block:8px 40px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}

.pill{display:inline-block;background:var(--navy);color:#fff;font-weight:700;font-size:15px;padding:6px 16px}
.facts{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
.facts li{border:2px solid var(--teal);padding:6px 14px;font-weight:600;font-size:15px;color:#fff}
h1.big{font-size:clamp(46px,14vw,72px);line-height:1.1;font-weight:700}
.lead{font-size:19px;line-height:1.7;color:var(--hero-soft);max-width:30em}

.btn{display:inline-flex;align-items:center;gap:12px;border:0;background:var(--btn);color:var(--btnfg);font-weight:700;font-size:19px;padding:16px 28px;min-height:56px;border-radius:0;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.on-green{background:#fff;color:var(--green)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn svg{width:22px;height:22px}

.orn{position:absolute;left:-150px;bottom:-170px;width:360px;height:360px;z-index:-1;opacity:.16;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- axes grid ---------- */
.sec{padding-block:36px 8px}
.kicker{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.02em;margin-bottom:6px}
h2.t{font-size:28px;line-height:1.3;font-weight:700;margin-bottom:18px}
.grid8{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0;margin:0;list-style:none}
.ax{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--green);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ax .row{display:flex;align-items:center;justify-content:space-between}
.ibox{width:44px;height:44px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ibox svg{width:24px;height:24px}
.num{font-size:26px;font-weight:700;color:var(--teal);line-height:1}
.ax b{font-size:17px;line-height:1.35}
.foot{padding-block:32px 48px;color:var(--soft);font-size:14px}
.mocbar{height:10px;display:flex;margin-top:28px;direction:ltr}
.mocbar i{display:block;height:100%}

/* ---------- question ---------- */
.prog{display:flex;flex-direction:column;gap:8px;padding-block:6px 26px}
.segs{display:flex;gap:6px}
.segs i{flex:1;height:8px;background:rgba(255,255,255,.28)}
.segs i.done{background:var(--teal)}
.segs i.cur{background:#fff}
.prog span{font-size:15px;font-weight:600;color:var(--hero-soft)}
.qwrap{padding-block:28px 16px;display:flex;flex-direction:column;gap:22px}
.qhead{display:flex;align-items:center;gap:14px}
.qhead .ibox{width:56px;height:56px}
.qhead .ibox svg{width:30px;height:30px}
.qhead .num{font-size:40px}
.qhead b{font-size:18px;color:var(--soft);font-weight:600}
.q{font-size:clamp(22px,6.2vw,28px);line-height:1.55;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.opt{width:100%;display:flex;align-items:center;gap:16px;text-align:right;background:var(--card);border:2px solid var(--line);padding:14px 16px;min-height:62px;border-radius:0;transition:background .15s,border-color .15s,transform .15s}
.opt:hover{border-color:var(--teal)}
.opt:active{transform:scale(.99)}
.opt .dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex:none;font-variant-numeric:tabular-nums}
.opt .lab{font-size:19px;font-weight:600}
.opt[aria-checked="true"]{background:var(--btn);border-color:var(--btn);color:var(--btnfg)}
.opt[aria-checked="true"] .dot{background:var(--btnfg);color:var(--btn);border-color:var(--btnfg)}
.back{align-self:flex-start;background:none;border:0;color:var(--soft);font-weight:600;padding:10px 0;display:inline-flex;gap:8px;align-items:center;min-height:44px}
.back svg{width:18px;height:18px}

.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- result ---------- */
.res-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding-block:6px 40px}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.22)}
.ring .pr{stroke:#fff}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .val b{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.ring .val small{font-size:14px;color:var(--hero-soft);margin-top:4px}
.res-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.res-t .k{font-size:15px;font-weight:600;color:var(--hero-soft)}
.res-t h1{font-size:clamp(32px,9vw,44px);line-height:1.15;font-weight:700}
.res-note{font-size:18px;line-height:1.75;color:#fff;padding-bottom:36px}

.card{background:var(--card);border:1px solid var(--line);padding:20px}
.stack{display:flex;flex-direction:column;gap:18px;padding-block:28px 8px}
.card h2{font-size:22px;line-height:1.35;margin-bottom:4px}
.card .sub{color:var(--soft);font-size:15px;margin-bottom:10px}
.radar{width:100%;max-width:380px;display:block;margin-inline:auto}
.radar .grid{fill:none;stroke:var(--radar-grid);stroke-width:1}
.radar .spoke{stroke:var(--radar-grid);stroke-width:1}
.radar .area{fill:var(--radar-fill);stroke:var(--radar-line);stroke-width:2.5;stroke-linejoin:round}
.radar .pt{fill:var(--radar-line);stroke:var(--card);stroke-width:2}
.radar .pt.weak{fill:var(--focus)}
.radar .lb circle{fill:var(--card);stroke:var(--radar-grid);stroke-width:1.2}
.radar .lb text{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--sans);text-anchor:middle;dominant-baseline:central}
.radar .lv{fill:var(--soft);font-size:9px;font-family:var(--sans);text-anchor:middle}

.focus{border-top:6px solid var(--focus);display:flex;flex-direction:column;gap:14px}
.focus .tag{align-self:flex-start;background:var(--focus);color:#1a0f05;font-weight:700;font-size:14px;padding:4px 12px}
.focus .ttl{display:flex;align-items:center;gap:12px}
.focus .ttl h2{margin:0}
.steps{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.step{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:right;background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:0}
.step .bx{width:26px;height:26px;border:2px solid var(--accent);flex:none;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step .bx svg{width:18px;height:18px;opacity:0;stroke:var(--btnfg)}
.step[aria-pressed="true"] .bx{background:var(--btn);border-color:var(--btn)}
.step[aria-pressed="true"] .bx svg{opacity:1}
.step[aria-pressed="true"] span{color:var(--soft);text-decoration:line-through}
.step span{font-size:17px;line-height:1.6;min-width:0}

.list{display:flex;flex-direction:column;padding:0;margin:0;list-style:none}
.li{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .n{font-size:22px;font-weight:700;color:var(--teal);width:34px;font-variant-numeric:tabular-nums}
.li .nm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.li .nm b{font-size:18px}
.chip{font-size:13px;font-weight:700;padding:2px 10px;color:#fff;background:var(--green)}
.chip.w{background:var(--focus);color:#1a0f05}
.li .bar{grid-column:2;display:flex;gap:4px;align-items:center}
.li .bar i{flex:1;height:8px;background:var(--track)}
.li .bar i.on{background:var(--teal)}
.li .bar em{font-style:normal;font-weight:700;font-size:14px;color:var(--soft);width:34px;text-align:left;font-variant-numeric:tabular-nums}
.li p{grid-column:2;color:var(--soft);font-size:15.5px;line-height:1.65}

.learn{display:flex;flex-direction:column;gap:10px}
.lk{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--bg);border:1px solid var(--line);padding:14px;min-height:64px}
.lk .ibox{width:44px;height:44px}
.lk b{display:block;font-size:17px;line-height:1.4}
.lk small{color:var(--soft);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:12px;padding-block:8px}
.toast{color:var(--good);font-weight:600;font-size:15px;min-height:24px;padding-bottom:8px}
.privacy{color:var(--soft);font-size:14px;padding-block:6px 40px}

@media (min-width:560px){
  .grid8{grid-template-columns:repeat(4,minmax(0,1fr))}
  .res-hero{gap:36px}
  .ring{width:176px;height:176px}
  .ring .val b{font-size:54px}
}
@media (prefers-reduced-motion:reduce){
  .orn{animation:none}
  .enter,.rise{animation:none}
  .btn,.opt{transition:none}
}
</style>
</head>

  for(var k=0;k<8;k++){var an=k*Math.PI/4;s+='<line x1="100" y1="100" x2="'+(100+100*Math.cos(an)).toFixed(1)+'" y2="'+(100+100*Math.sin(an)).toFixed(1)+'"/>';}

  return s;
}

function calc(){
  var sum=S.a.reduce(function(p,c){return p+c;},0);
  var pct=Math.round((sum-AXES.length)/(AXES.length*4)*100);
  var lvl=LEVELS.filter(function(l){return pct<l.max;})[0];
  var min=Math.min.apply(null,S.a),max=Math.max.apply(null,S.a);
  return {sum:sum,pct:pct,lvl:lvl,min:min,max:max,weak:S.a.indexOf(min),best:S.a.indexOf(max)};
}

function radarSVG(){
  var C=150,R=104,n=AXES.length,i,s='<svg class="radar" viewBox="0 0 300 300" role="img" aria-label="خريطة المحاور الثمانية">';
  function pt(k,r){var an=-Math.PI/2+k*2*Math.PI/n;return [C+r*Math.cos(an),C+r*Math.sin(an)];}
  for(i=1;i<=5;i++){var pts=[];for(var k=0;k<n;k++){var p=pt(k,R*i/5);pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));}s+='<polygon class="grid" points="'+pts.join(' ')+'"/>';}
  for(i=0;i<n;i++){var e=pt(i,R);s+='<line class="spoke" x1="'+C+'" y1="'+C+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'"/>';}
  s+='<polygon class="area" id="area" points="'+Array(n+1).join(C+','+C+' ').trim()+'"/>';
  for(i=0;i<n;i++){s+='<circle class="pt'+(S.a[i]===calc().min&&i===calc().weak?' weak':'')+'" id="pt'+i+'" cx="'+C+'" cy="'+C+'" r="4.5"/>';}
  for(i=0;i<n;i++){var l=pt(i,R+24);s+='<g class="lb"><circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="12"/><text x="'+l[0].toFixed(1)+'" y="'+l[1].toFixed(1)+'">'+AXES[i].n+'</text></g>';}
  s+='</svg>';
  return s;
}
